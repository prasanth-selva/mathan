<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cyber Terminal Login</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: Arial, Helvetica, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background-image: url('img.jpeg');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
  }

  .overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.45);
    z-index: 1;
  }

  .puzzle-container {
    position: relative;
    z-index: 2;
    background: #ffffff;
    width: 340px;
    padding: 28px 25px;
    border-radius: 8px;
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6);
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.85rem;
    font-weight: bold;
    color: #666;
    border-bottom: 2px solid #eee;
    padding-bottom: 8px;
    margin-bottom: 4px;
  }

  .form-group {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  label {
    font-size: 0.9rem;
    font-weight: bold;
    color: #222222;
  }

  .error-msg {
    color: #ff0000;
    font-size: 0.82rem;
    font-weight: bold;
    display: none;
    margin-top: 2px;
  }

  input[type="text"],
  input[type="password"] {
    width: 100%;
    padding: 10px;
    border: 1px solid #bbbbbb;
    border-radius: 4px;
    font-size: 0.95rem;
    outline: none;
    transition: border-color 0.2s;
  }

  input[type="text"]:focus,
  input[type="password"]:focus {
    border-color: #008000;
    box-shadow: 0 0 5px rgba(0, 128, 0, 0.3);
  }

  .hint-text {
    font-size: 0.85rem;
    font-weight: bold;
    color: #444444;
    letter-spacing: 0.5px;
    margin-top: 2px;
  }

  button {
    width: 100%;
    padding: 11px;
    background-color: #000000;
    color: #00ff66;
    border: 1px solid #00ff66;
    border-radius: 4px;
    font-size: 0.9rem;
    font-weight: bold;
    cursor: pointer;
    text-transform: uppercase;
    transition: all 0.2s ease;
    margin-top: 10px;
  }

  button:hover {
    background-color: #00ff66;
    color: #000000;
    box-shadow: 0 0 10px rgba(0, 255, 102, 0.8);
  }
</style>
</head>
<body>

<div class="overlay"></div>

<div class="puzzle-container">
  <div class="card-header">
    <span>CYBER PUZZLE</span>
    <span>LOGIN TERMINAL</span>
  </div>

  <div class="form-group">
    <label for="username">Username:</label>
    <div id="usernameError" class="error-msg">Please enter a username!</div>
    <input type="text" id="username" placeholder="Enter username">
  </div>

  <div class="form-group">
    <label for="password">Password:</label>
    <div id="passwordError" class="error-msg">Incorrect password!</div>
    <input type="password" id="password" placeholder="Enter digits only">
  </div>

  <div class="hint-text">HINT: LOOK AROUND</div>

  <button id="submitBtn" onclick="validateLogin()">Submit</button>
</div>

<script>
  const TARGET_PASSWORD = "31120110";

  const usernameInput = document.getElementById("username");
  const passwordInput = document.getElementById("password");
  const usernameError = document.getElementById("usernameError");
  const passwordError = document.getElementById("passwordError");

  // Real-time password character restriction check
  passwordInput.addEventListener("input", function() {
    const val = passwordInput.value;
    const containsNonDigits = /[^\d]/.test(val);

    if (containsNonDigits) {
      passwordError.textContent = "Characters not allowed! Digits only.";
      passwordError.style.display = "block";
    } else {
      passwordError.style.display = "none";
    }
  });

  function validateLogin() {
    const uVal = usernameInput.value.trim();
    const pVal = passwordInput.value;
    let hasError = false;

    if (!uVal) {
      usernameError.style.display = "block";
      hasError = true;
    } else {
      usernameError.style.display = "none";
    }

    if (!pVal) {
      passwordError.textContent = "Please enter password!";
      passwordError.style.display = "block";
      hasError = true;
    } else if (/[^\d]/.test(pVal)) {
      passwordError.textContent = "Characters not allowed! Digits only.";
      passwordError.style.display = "block";
      hasError = true;
    } else if (pVal !== TARGET_PASSWORD) {
      passwordError.textContent = "Incorrect password!";
      passwordError.style.display = "block";
      hasError = true;
    } else {
      passwordError.style.display = "none";
    }

    if (!hasError) {
      alert("Access Granted!");
    }
  }
</script>

</body>
</html>
